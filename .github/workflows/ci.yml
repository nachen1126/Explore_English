name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: corepack enable
      - run: corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
        working-directory: miniapp
      - run: pnpm run typecheck
        working-directory: miniapp
      - run: pnpm run test
        working-directory: miniapp
      - run: pnpm run build:weapp
        working-directory: miniapp
      - run: docker build -t explore-english:ci .
